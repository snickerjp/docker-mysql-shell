name: Check for new MySQL Shell release

on:
  schedule:
    - cron: '17 3 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -oP '(?<=MYSQL_SHELL_VERSION=)\d[\d.]+' docker/Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract current version from Dockerfile"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Get latest version from GitHub
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mysql/mysql-shell/tags?per_page=100")

          # Validate API response
          if [ -z "$API_RESPONSE" ] || echo "$API_RESPONSE" | jq -e '.message' > /dev/null 2>&1; then
            echo "::error::GitHub API request failed: $(echo "$API_RESPONSE" | jq -r '.message // "Unknown error"')"
            exit 1
          fi

          # Extract all valid version tags and sort to find latest
          LATEST=$(echo "$API_RESPONSE" \
            | jq -r '[.[] | select(.name | test("^\\d+\\.\\d+\\.\\d+$"))][].name' \
            | sort -V | tail -1)

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Failed to determine latest version from API response"
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST"

      - name: Check if update needed
        id: check
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> $GITHUB_OUTPUT
            echo "Already up to date: $CURRENT"
            exit 0
          fi

          # Verify LATEST > CURRENT using version sort
          HIGHER=$(echo -e "$CURRENT\n$LATEST" | sort -V | tail -1)
          if [ "$HIGHER" = "$LATEST" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
            echo "Update available: $CURRENT -> $LATEST"
          else
            echo "update=false" >> $GITHUB_OUTPUT
            echo "::warning::Latest ($LATEST) is not newer than current ($CURRENT). Skipping."
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.update == 'true'
        run: |
          sed -i "s/MYSQL_SHELL_VERSION=.*/MYSQL_SHELL_VERSION=${{ steps.latest.outputs.version }}/" docker/Dockerfile
          echo "Updated Dockerfile to version ${{ steps.latest.outputs.version }}"

      - name: Update README version
        if: steps.check.outputs.update == 'true'
        run: |
          sed -i "s/docker-mysql-shell:${{ steps.current.outputs.version }}/docker-mysql-shell:${{ steps.latest.outputs.version }}/g" README.md
          echo "Updated README to version ${{ steps.latest.outputs.version }}"

      - name: Set up Docker Buildx
        if: steps.check.outputs.update == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build test (verify new version builds)
        if: steps.check.outputs.update == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          push: false
          load: true
          tags: snickerjp/docker-mysql-shell:update-test

      - name: Verify new image works
        if: steps.check.outputs.update == 'true'
        run: |
          docker run --rm snickerjp/docker-mysql-shell:update-test --version

      - name: Create Pull Request
        if: steps.check.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update MySQL Shell to ${{ steps.latest.outputs.version }}"
          title: "chore: update MySQL Shell to ${{ steps.latest.outputs.version }}"
          body: |
            MySQL Shell の新しいバージョンが利用可能です。

            - **現在**: ${{ steps.current.outputs.version }}
            - **最新**: ${{ steps.latest.outputs.version }}

            ✅ ビルドテスト・動作確認済み（このワークフロー内で実施）

            このPRをマージすると、Docker imageが自動的にビルド＆pushされます。
          branch: bot/update-mysql-shell-${{ steps.latest.outputs.version }}
          labels: automerge
