name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP '(?<=MYSQL_SHELL_VERSION=)\d+\.\d+\.\d+' docker/Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from Dockerfile"
            exit 1
          fi
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: snickerjp/docker-mysql-shell
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
            type=raw,value=Innovation

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: snickerjp/docker-mysql-shell
          readme-filepath: ./README.md
